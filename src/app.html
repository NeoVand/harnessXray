<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="text-scale" content="scale" />
		<link rel="icon" href="%sveltekit.assets%/favicon.svg" type="image/svg+xml" />
		<title>harnessXray</title>
		<meta
			name="description"
			content="An educational lab that runs a real Deep Agents harness in the browser and dissects it live."
		/>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<script>
			// Before first paint, or the app flashes light and then snaps to dark.
			// Dark is the default here: this is an instrument you stare at, and the
			// panels were tuned for it. An explicit choice overrides it.
			try {
				var t = localStorage.getItem('hx:theme');
				if (t !== 'light') document.documentElement.classList.add('dark');
			} catch (e) {
				document.documentElement.classList.add('dark');
			}
		</script>
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
