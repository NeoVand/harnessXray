<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="text-scale" content="scale" />
		<link rel="icon" href="%sveltekit.assets%/favicon.svg" type="image/svg+xml" />
		<meta name="theme-color" content="#131316" />
		<title>harnessXray</title>
		<meta
			name="description"
			content="An educational lab that runs a real Deep Agents harness in the browser and dissects it live."
		/>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<script>
			// Before first paint, or the app flashes one theme and snaps to another.
			// Kept in sync with THEMES in src/lib/state/theme.svelte.ts — this is the
			// one place that cannot import it, because it has to run before any
			// module does.
			(function () {
				var dark = { midnight: 1, rainy: 1 };
				var meta = {
					midnight: '#131316',
					rainy: '#121820',
					cloudy: '#eef1f3',
					sunny: '#f5f1e8'
				};
				// Stored ids this app no longer ships — the old two-state toggle and
				// the retired themes — mapped the same way normalizeTheme() maps them.
				var legacy = {
					dark: 'midnight',
					cocoa: 'midnight',
					ocean: 'rainy',
					forest: 'rainy',
					light: 'cloudy',
					meadow: 'cloudy'
				};
				var t = 'midnight';
				try {
					var s = localStorage.getItem('hx:theme');
					if (s && legacy[s]) s = legacy[s];
					if (s && meta[s]) t = s;
				} catch (e) {
					/* private mode — the default is fine */
				}
				var root = document.documentElement;
				root.dataset.theme = t;
				if (dark[t]) root.classList.add('dark');
				var tag = document.querySelector('meta[name="theme-color"]');
				if (tag) tag.setAttribute('content', meta[t]);
			})();
		</script>
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
