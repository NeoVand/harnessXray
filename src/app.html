<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="text-scale" content="scale" />
		<link rel="icon" href="%sveltekit.assets%/favicon.svg" type="image/svg+xml" />
		<meta name="theme-color" content="#131316" />
		<title>harnessXray</title>
		<meta
			name="description"
			content="An educational lab that runs a real Deep Agents harness in the browser and dissects it live."
		/>

		<!--
			The share card.

			Absolute URLs, and literal ones: link scrapers do not run our
			JavaScript and do not resolve `%sveltekit.assets%`, so the deployed
			origin is written out here rather than derived. It matches SITE_URL in
			src/lib/meta.ts — change both together. The image is static/og.png:
			docs/screenshot.png fitted to 630 tall and matted out to 1200×630 on
			the app's own midnight (#131316), so the card is the whole instrument
			panel with margins rather than a crop of it.
		-->
		<meta property="og:type" content="website" />
		<meta property="og:site_name" content="harnessXray" />
		<meta property="og:url" content="https://neovand.github.io/harnessXray/" />
		<meta property="og:title" content="harnessXray — a real agent harness, dissected live" />
		<meta
			property="og:description"
			content="An educational lab that runs a real Deep Agents harness entirely in your browser and X-rays it while it works: every request on the wire, the context window taken apart, the plan, the files, the graph."
		/>
		<meta property="og:image" content="https://neovand.github.io/harnessXray/og.png" />
		<meta property="og:image:type" content="image/png" />
		<meta property="og:image:width" content="1200" />
		<meta property="og:image:height" content="630" />
		<meta
			property="og:image:alt"
			content="The harnessXray interface: a conversation with the agent on the left; the plan, event timeline and context window in the middle; the virtual filesystem and the live graph on the right."
		/>

		<meta name="twitter:card" content="summary_large_image" />
		<meta name="twitter:title" content="harnessXray — a real agent harness, dissected live" />
		<meta
			name="twitter:description"
			content="An educational lab that runs a real Deep Agents harness entirely in your browser and X-rays it while it works."
		/>
		<meta name="twitter:image" content="https://neovand.github.io/harnessXray/og.png" />

		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<script>
			// LangChain's dependency stack probes `process` in ways the build's
			// `define: {'process.env': ...}` cannot reach — a path polyfill calls
			// `process.cwd()` bare, others read `process.platform`. Browsers have
			// no `process`, so the first agent turn of a *production* build died
			// with ReferenceError while dev (whose CJS prebundle shims it) worked.
			// The stub makes those probes read undefined-ish instead of throwing.
			globalThis.process ??= { env: {}, versions: {}, platform: '', cwd: () => '/' };
		</script>
		<script>
			// Before first paint, or the app flashes one theme and snaps to another.
			// Kept in sync with THEMES in src/lib/state/theme.svelte.ts — this is the
			// one place that cannot import it, because it has to run before any
			// module does.
			(function () {
				var dark = { midnight: 1, rainy: 1 };
				var meta = {
					midnight: '#131316',
					rainy: '#121820',
					cloudy: '#eef1f3',
					sunny: '#f5f1e8'
				};
				// Stored ids this app no longer ships — the old two-state toggle and
				// the retired themes — mapped the same way normalizeTheme() maps them.
				var legacy = {
					dark: 'midnight',
					cocoa: 'midnight',
					ocean: 'rainy',
					forest: 'rainy',
					light: 'cloudy',
					meadow: 'cloudy'
				};
				var t = 'midnight';
				try {
					var s = localStorage.getItem('hx:theme');
					if (s && legacy[s]) s = legacy[s];
					if (s && meta[s]) t = s;
				} catch (e) {
					/* private mode — the default is fine */
				}
				var root = document.documentElement;
				root.dataset.theme = t;
				if (dark[t]) root.classList.add('dark');
				var tag = document.querySelector('meta[name="theme-color"]');
				if (tag) tag.setAttribute('content', meta[t]);
			})();
		</script>
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
