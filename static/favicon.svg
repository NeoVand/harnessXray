<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none">
  <!--
    The same brain-circuit glyph the app wears in its header and on its title
    card, so the tab, the window and the page agree about what this is.

    Generated from hugeicons' `BrainCircuitIcon` rather than redrawn — the
    previous favicon was a hand-transcription of the old glyph, which is a
    second copy of the artwork that can drift from the first. Regenerate with
    the snippet in docs/PLAN.md if the icon ever changes again.

    Colour is set on :root and inherited through currentColor rather than
    hardcoded per path: an SVG favicon is rendered against the browser's own
    chrome, which is dark for some people and light for others, and a single
    fixed ink disappears into one of them.

    Stroke is 1.6 rather than the icon's native 1.5 — at 16px the extra tenth
    is the difference between traces that read and traces that dissolve.
  -->
  <style>
    :root { color: #1c1c1e; }
    @media (prefers-color-scheme: dark) { :root { color: #e6e6e6; } }
  </style>
